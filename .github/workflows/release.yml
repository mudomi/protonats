name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags="-s -w" \
            -o "protoc-gen-protonats-${GOOS}-${GOARCH}${EXT}" \
            ./cmd/protoc-gen-protonats
          go build -trimpath -ldflags="-s -w" \
            -o "protoc-gen-protonats-ts-${GOOS}-${GOARCH}${EXT}" \
            ./cmd/protoc-gen-protonats-ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: protoc-gen-protonats-${{ matrix.goos }}-${{ matrix.goarch }}
          path: protoc-gen-protonats*-*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: protoc-gen-protonats*-*
